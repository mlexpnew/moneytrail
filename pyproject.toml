[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbridge"
version = "1.0.0"
description = "AML transaction monitoring with explainable alerts and a ranked case queue"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy>=1.26", "openpyxl>=3.1"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9",
       "streamlit>=1.35"]

[project.scripts]
workbridge = "workbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 112
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
